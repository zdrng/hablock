name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic version name without a leading v (e.g. 0.1.0)'
        required: true
        type: string
      version_code:
        description: 'Monotonically increasing Android version code (1-2100000000)'
        required: true
        type: string
      create_release:
        description: 'Create a GitHub release with the APK (untick for a test run)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate version inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::version_name must be a semantic version without a leading v (for example, 0.1.0 or 0.1.0-rc.1)."
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( VERSION_CODE > 2100000000 )); then
            echo "::error::version_code must be an integer from 1 to 2100000000 without leading zeroes."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "::warning::No signing secrets set — release APK will be unsigned."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets must either all be set or all be omitted."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/hablock-release.keystore
          cat > keystore.properties <<EOF
          storeFile=$HOME/hablock-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run tests
        run: ./gradlew test

      - name: Build release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -PenableEmergencyReset=false

      - name: Resolve APK artifact
        env:
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            apk_path=app/build/outputs/apk/release/app-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            if [ "$CREATE_RELEASE" = "true" ]; then
              echo "::error::A GitHub release must not be created from an unsigned APK."
              exit 1
            fi
            apk_path=app/build/outputs/apk/release/app-release-unsigned.apk
          else
            echo "::error::assembleRelease did not produce an APK."
            exit 1
          fi
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"

      - name: Verify APK version metadata
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          actual_version_name="$(apkanalyzer manifest version-name "$APK_PATH")"
          actual_version_code="$(apkanalyzer manifest version-code "$APK_PATH")"

          if [[ "$actual_version_name" != "$VERSION_NAME" ]]; then
            echo "::error::APK versionName is '$actual_version_name'; expected '$VERSION_NAME'."
            exit 1
          fi
          if [[ "$actual_version_code" != "$VERSION_CODE" ]]; then
            echo "::error::APK versionCode is '$actual_version_code'; expected '$VERSION_CODE'."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hablock-v${{ inputs.version_name }}
          path: ${{ env.APK_PATH }}

      - name: Create GitHub release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          git tag "v$VERSION_NAME"
          git push origin "v$VERSION_NAME"
          gh release create "v$VERSION_NAME" \
            --title "v$VERSION_NAME" \
            --generate-notes \
            "$APK_PATH"
